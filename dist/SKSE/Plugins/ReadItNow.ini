[Main]
bShowForSkillBooks = 1
bShowForSpellTomes = 1

; How the book is opened when you accept the prompt.
; 0 = open it straight from your inventory (same as clicking it in the Inventory menu). Recommended.
; 1 = old method: drop the book, read it from the world, then hand it back.
iOpenMethod = 0

[AutoTurn]
; Turn pages automatically while Voiced Books of Skyrim reads the book aloud.
; Works for any book you open, not only ones opened with the Read prompt.
bAutoTurnPages = 1

; Close a book while it's being read (to fight, say) and its narration pauses instead of playing on or stopping.
; Open the same book again and it continues where it stopped, back on the pages you were on.
; Opening a different book drops the paused narration. After loading a save, books start from the beginning.
; 0 = off (Voiced Books' own behavior when a book closes).
bResumeOnReopen = 1

; Read while walking: while a book is being narrated, press your Forward key and the book screen closes; the
; narration keeps going and a small page in the upper-right corner shows the page the narrator is on.
; In combat the narration pauses and continues when the fight is over. If a fight starts while the full book is open
; (menus that don't pause the game, e.g. Skyrim Souls RE), the book switches to the mini page and pauses by itself.
; Other menus (inventory, map...) hide the mini page while they're open.
; Stand still for fReopenAfterStill seconds (out of combat) and the full book opens again on the narrator's pages.
bReadWhileWalking = 1
fReopenAfterStill = 8.0
; Mini page size (fraction of the screen width / height) and opacity
fMiniPageWidth = 0.25
fMiniPageHeight = 0.5
fMiniPageOpacity = 0.92

; Seconds to wait after the narrator finishes the last word of the open pages.
; The finish time comes from the timing data in SKSE\Plugins\ReadItNow\VBoSTimings
; (or, for a book without timing data, an estimate from the word count).
; Raise it if pages turn too early, lower it (even negative, e.g. -0.5) if too late.
fTurnDelay = 0.75

; How the page turn is sent.
; 1 = a Windows key press (recommended: the only way the test showed actually turns the page;
;     Skyrim must be the active window)
; 2 = an event to the game's input handling (does NOT reach the Book Menu)
; 0 = through the game's input queue (does NOT reach the Book Menu)
iTurnMethod = 1

; The key pressed for iTurnMethod 1, as a DirectInput code. 205 (0xCD) = Right Arrow, which turns the page.
; Your mapped Next Page key (D) does NOT turn book pages.
iTurnKey = 205

; TEST MODE: when a book opens, try each way of turning the page once (3 s apart) and log which one
; actually turned it. No automatic turning while this is on.
bProbeTurnMethods = 0

; Write details to Documents\My Games\Skyrim Special Edition\SKSE\ReadItNow.log
bDebugLog = 1
